<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Debate Me · AI vs You</title>
    <style>
        /* ===== ALL STYLES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: linear-gradient(145deg, #0b0d15 0%, #141824 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .debate-card {
            max-width: 820px;
            width: 100%;
            background: rgba(22, 27, 38, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 1.8rem 1.5rem 2rem;
            box-shadow: 0 25px 50px -10px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,215,100,0.08);
            border: 1px solid rgba(255,215,100,0.12);
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 2rem;
            font-weight: 700;
            color: #f5e9d8;
            text-shadow: 0 2px 0 #0b0d15;
            margin-bottom: 0.2rem;
            flex-wrap: wrap;
        }
        h1 span {
            background: #f5b342;
            color: #0f131f;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.1rem 0.9rem;
            border-radius: 40px;
            box-shadow: 0 4px 0 #a06b1e;
        }
        .subhead {
            color: #a9b3cc;
            font-size: 0.95rem;
            border-left: 3px solid #f5b342;
            padding-left: 1rem;
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }
        .topic-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #2e3548;
            padding-bottom: 1.2rem;
        }
        .topic-btn {
            background: #1f2638;
            border: none;
            color: #c8d0e6;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #313a52;
            flex: 1 0 auto;
            touch-action: manipulation;
        }
        .topic-btn:hover, .topic-btn:active { background: #2d364e; color: #fff; border-color: #f5b342; transform: scale(1.02); }
        .topic-btn.active {
            background: #f5b342;
            color: #0f131f;
            border-color: #f5b342;
            font-weight: 600;
            box-shadow: 0 4px 0 #a06b1e;
        }
        .debate-window {
            background: #131a26;
            border-radius: 1.8rem;
            padding: 1.2rem;
            min-height: 260px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #2b334a;
            box-shadow: inset 0 8px 12px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            margin-bottom: 1.4rem;
            -webkit-overflow-scrolling: touch;
        }
        .message {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
            animation: fadeSlide 0.3s ease;
        }
        .message.ai { flex-direction: row; }
        .message.you { flex-direction: row-reverse; }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .avatar.ai { background: #d43f34; color: #ffe3c9; border: 1px solid #f5b342; }
        .avatar.you { background: #2b6f9e; color: #e9f2fa; border: 1px solid #7bb3d9; }
        .bubble {
            background: #1f263a;
            padding: 0.7rem 1.1rem;
            border-radius: 1.3rem;
            max-width: 80%;
            line-height: 1.5;
            color: #e7edf5;
            border: 1px solid #2f3853;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-size: 0.95rem;
            word-break: break-word;
        }
        .bubble strong { color: #f5b342; font-weight: 600; }
        .bubble.ai-bubble { border-bottom-left-radius: 0.3rem; }
        .bubble.you-bubble {
            border-bottom-right-radius: 0.3rem;
            background: #1d314a;
            border-color: #3b5a7a;
        }
        .score-board {
            display: flex;
            justify-content: flex-end;
            gap: 1.5rem;
            padding: 0.4rem 0.2rem 0;
            font-weight: 500;
            color: #b7c2db;
            border-top: 1px solid #2c344b;
            margin-top: 0.6rem;
            flex-wrap: wrap;
        }
        .score-board span {
            background: #1c2338;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            border: 1px solid #35405e;
            font-size: 0.9rem;
        }
        .score-board .score-val { color: #f5d48a; font-weight: 700; }
        .action-area {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }
        .input-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        #userInput {
            flex: 2;
            min-width: 160px;
            background: #0f1622;
            border: 2px solid #2e3852;
            border-radius: 60px;
            padding: 0.8rem 1.2rem;
            font-size: 0.95rem;
            color: #f0f4ff;
            outline: none;
            transition: 0.15s;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.4);
        }
        #userInput:focus { border-color: #f5b342; background: #141d2e; }
        #userInput::placeholder { color: #63708f; font-weight: 300; }
        .btn {
            background: #29324b;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            padding: 0.8rem 1.4rem;
            color: #eef3ff;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #3e4a6b;
            box-shadow: 0 4px 0 #0b0d15;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            flex: 1 0 auto;
            justify-content: center;
            font-size: 0.95rem;
            touch-action: manipulation;
        }
        .btn-primary {
            background: #f5b342;
            border-color: #f5b342;
            color: #0b0f1a;
            box-shadow: 0 4px 0 #a06b1e;
        }
        .btn-primary:hover, .btn-primary:active { background: #ffc25c; transform: scale(1.02); }
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #a06b1e; }
        .btn-reset {
            background: transparent;
            border: 1px solid #47527a;
            color: #aab6d6;
            box-shadow: none;
            flex: 0.4;
            padding: 0.8rem 1rem;
        }
        .btn-reset:hover, .btn-reset:active { background: #29324b; color: white; }
        .btn-share {
            background: #1da1f2;
            border-color: #1da1f2;
            color: white;
            box-shadow: 0 4px 0 #0d6b9e;
            flex: 0.4;
        }
        .btn-share:hover, .btn-share:active { background: #3aa8f4; }
        .helper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #677699;
            font-size: 0.85rem;
            padding: 0.2rem 0.2rem 0;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .helper .hint { font-style: italic; }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 550px) {
            .debate-card { padding: 1.2rem; }
            h1 { font-size: 1.6rem; }
            .topic-btn { flex: 1 1 100%; }
            .bubble { max-width: 92%; }
            .input-group { flex-direction: column; }
            .btn { flex: 1; }
            .btn-share, .btn-reset { flex: 1; }
        }
    </style>
</head>
<body>
<div class="debate-card" id="app">
    <h1>⚡ Debate Me <span>AI</span></h1>
    <div class="subhead">Pick a topic · Argue · Get scored on logic & rhetoric</div>

    <div class="topic-selector" id="topicSelector">
        <button class="topic-btn active" data-topic="ai">🤖 AI</button>
        <button class="topic-btn" data-topic="climate">🌍 Climate</button>
        <button class="topic-btn" data-topic="privacy">🔐 Privacy</button>
        <button class="topic-btn" data-topic="education">📚 Education</button>
        <button class="topic-btn" data-topic="politics">🗳️ Politics</button>
        <button class="topic-btn" data-topic="health">💊 Health</button>
    </div>

    <div class="debate-window" id="debateWindow">
        <div id="messagesContainer"></div>
        <div class="score-board">
            <span>🧠 Logic: <span class="score-val" id="logicScore">0</span></span>
            <span>🎯 Rhetoric: <span class="score-val" id="rhetoricScore">0</span></span>
        </div>
    </div>

    <div class="action-area">
        <div class="input-group">
            <input type="text" id="userInput" placeholder="State your argument..." inputmode="text" />
            <button class="btn btn-primary" id="submitBtn">⚡ Debate</button>
            <button class="btn btn-reset" id="resetBtn">↺ Reset</button>
            <button class="btn btn-share" id="shareBtn">🐦 Share</button>
        </div>
        <div class="helper">
            <span class="hint">💡 Press <kbd>Enter</kbd></span>
            <span id="topicIndicator" style="color:#f5b342;">Topic: AI</span>
        </div>
    </div>
</div>
