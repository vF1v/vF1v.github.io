<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartAI</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <h1>SmartAI</h1>

  <button id="newChat">+ New Chat</button>

  <div class="chat-list">
    <div class="chat-item">Welcome Chat</div>
  </div>

  <div class="bottom">
    vF1v.github.io
  </div>

</div>

<!-- MAIN -->

<div class="main">

  <div class="topbar">
    <h2>SmartAI</h2>
  </div>

  <!-- CHAT -->

  <div id="chatBox">

    <div class="message ai">
      Hello! I'm SmartAI.
    </div>

  </div>

  <!-- TYPING -->

  <div class="typing" id="typing">
    SmartAI is typing...
  </div>

  <!-- INPUT -->

  <div class="inputArea">

    <input
      type="text"
      id="userInput"
      placeholder="Message SmartAI..."
      autocomplete="off"
    >

    <button id="sendBtn">
      Send
    </button>

  </div>

  <!-- DISCLAIMER -->

  <div class="disclaimer">
    Fan-made AI interface. Not affiliated with OpenAI or ChatGPT.
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
