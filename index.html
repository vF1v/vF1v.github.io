<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debate Me · AI vs You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b0d15 0%, #141824 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .debate-card {
            max-width: 820px;
            width: 100%;
            background: rgba(22, 27, 38, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 2rem 2rem 2.2rem;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 100, 0.08);
            border: 1px solid rgba(255, 215, 100, 0.12);
            transition: 0.25s ease;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #f5e9d8;
            text-shadow: 0 2px 0 #0b0d15;
            margin-bottom: 0.25rem;
        }
        h1 span {
            background: #f5b342;
            color: #0f131f;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0.1rem 0.9rem;
            border-radius: 40px;
            margin-left: 0.3rem;
            box-shadow: 0 4px 0 #a06b1e;
        }
        .subhead {
            color: #a9b3cc;
            font-size: 1rem;
            font-weight: 400;
            border-left: 3px solid #f5b342;
            padding-left: 1rem;
            margin-bottom: 1.8rem;
            opacity: 0.9;
        }
        .topic-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #2e3548;
            padding-bottom: 1.4rem;
        }
        .topic-btn {
            background: #1f2638;
            border: none;
            color: #c8d0e6;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 0 #0b0d15;
            border: 1px solid #313a52;
            flex: 1 0 auto;
        }
        .topic-btn:hover {
            background: #2d364e;
            color: #fff;
            border-color: #f5b342;
            transform: scale(1.02);
        }
        .topic-btn.active {
            background: #f5b342;
            color: #0f131f;
            border-color: #f5b342;
            font-weight: 600;
            box-shadow: 0 4px 0 #a06b1e;
        }
        .debate-window {
            background: #131a26;
            border-radius: 1.8rem;
            padding: 1.6rem;
            min-height: 280px;
            border: 1px solid #2b334a;
            box-shadow: inset 0 8px 12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            margin-bottom: 1.6rem;
        }
        .message {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            animation: fadeSlide 0.3s ease;
        }
        .message.ai {
            flex-direction: row;
        }
        .message.you {
            flex-direction: row-reverse;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }
        .avatar.ai {
            background: #d43f34;
            color: #ffe3c9;
            border: 1px solid #f5b342;
        }
        .avatar.you {
            background: #2b6f9e;
            color: #e9f2fa;
            border: 1px solid #7bb3d9;
        }
        .bubble {
            background: #1f263a;
            padding: 0.9rem 1.3rem;
            border-radius: 1.3rem;
            max-width: 78%;
            line-height: 1.5;
            color: #e7edf5;
            border: 1px solid #2f3853;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            font-size: 0.98rem;
            word-break: break-word;
        }
        .bubble strong {
            color: #f5b342;
            font-weight: 600;
        }
        .bubble.ai-bubble {
            border-bottom-left-radius: 0.3rem;
        }
        .bubble.you-bubble {
            border-bottom-right-radius: 0.3rem;
            background: #1d314a;
            border-color: #3b5a7a;
        }
        .score-board {
            display: flex;
            justify-content: flex-end;
            gap: 1.8rem;
            padding: 0.2rem 0.2rem 0.6rem 0.2rem;
            font-weight: 500;
            color: #b7c2db;
            border-top: 1px solid #2c344b;
            margin-top: 0.4rem;
        }
        .score-board span {
            background: #1c2338;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            border: 1px solid #35405e;
        }
        .score-board .score-val {
            color: #f5d48a;
            font-weight: 700;
        }
        .action-area {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .input-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        #userInput {
            flex: 2;
            min-width: 190px;
            background: #0f1622;
            border: 2px solid #2e3852;
            border-radius: 60px;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            color: #f0f4ff;
            outline: none;
            transition: 0.15s;
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.4);
        }
        #userInput:focus {
            border-color: #f5b342;
            background: #141d2e;
        }
        #userInput::placeholder {
            color: #63708f;
            font-weight: 300;
        }
        .btn {
            background: #29324b;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            padding: 0.9rem 1.8rem;
            color: #eef3ff;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #3e4a6b;
            box-shadow: 0 4px 0 #0b0d15;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1 0 auto;
            justify-content: center;
        }
        .btn-primary {
            background: #f5b342;
            border-color: #f5b342;
            color: #0b0f1a;
            box-shadow: 0 4px 0 #a06b1e;
        }
        .btn-primary:hover {
            background: #ffc25c;
            transform: scale(1.02);
        }
        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a06b1e;
        }
        .btn-secondary {
            background: #2f3a58;
            border-color: #4a5880;
        }
        .btn-secondary:hover {
            background: #3f4d72;
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: scale(0.97);
            box-shadow: 0 2px 0 #0b0d15;
            pointer-events: none;
        }
        .btn-reset {
            background: transparent;
            border: 1px solid #47527a;
            color: #aab6d6;
            box-shadow: none;
            flex: 0.5;
            padding: 0.9rem 1.2rem;
        }
        .btn-reset:hover {
            background: #29324b;
            color: white;
        }
        .helper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #677699;
            font-size: 0.9rem;
            padding: 0.3rem 0.2rem 0;
        }
        .helper .hint {
            font-style: italic;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 550px) {
            .debate-card { padding: 1.5rem; }
            h1 { font-size: 1.7rem; }
            .topic-btn { flex: 1 1 100%; }
            .bubble { max-width: 92%; }
            .input-group { flex-direction: column; }
            .btn { flex: 1; }
        }
    </style>
</head>
<body>
    <div class="debate-card" id="app">
        <h1>
            ⚡ Debate Me
            <span>AI</span>
        </h1>
        <div class="subhead">Pick a topic · Argue · Get scored on logic & rhetoric</div>

        <!-- Topic selector -->
        <div class="topic-selector" id="topicSelector">
            <button class="topic-btn active" data-topic="ai">🤖 AI & future</button>
            <button class="topic-btn" data-topic="climate">🌍 Climate action</button>
            <button class="topic-btn" data-topic="privacy">🔐 Privacy vs security</button>
            <button class="topic-btn" data-topic="education">📚 Education reform</button>
        </div>

        <!-- Debate window -->
        <div class="debate-window" id="debateWindow">
            <div id="messagesContainer">
                <!-- dynamic messages injected here -->
                <div class="message ai">
                    <div class="avatar ai">🤖</div>
                    <div class="bubble ai-bubble"><strong>AI:</strong> Choose a topic and state your position. I’ll take the opposing view. Ready?</div>
                </div>
            </div>
            <div class="score-board">
                <span>🧠 Logic: <span class="score-val" id="logicScore">0</span></span>
                <span>🎯 Rhetoric: <span class="score-val" id="rhetoricScore">0</span></span>
            </div>
        </div>

        <!-- Action area -->
        <div class="action-area">
            <div class="input-group">
                <input type="text" id="userInput" placeholder="State your argument..." />
                <button class="btn btn-primary" id="submitBtn">⚡ Debate</button>
                <button class="btn btn-reset" id="resetBtn">↺ Reset</button>
            </div>
            <div class="helper">
                <span class="hint">💡 Press <kbd>Enter</kbd> to debate</span>
                <span id="topicIndicator" style="color:#f5b342;">Topic: AI & future</span>
            </div>
        </div>
    </div>
    <script>
        (function(){
            "use strict";

            // ----- DEBATE ENGINE (AI OPPONENT + SCORING) -----
            const topicData = {
                ai: {
                    label: 'AI & future',
                    opponent: 'AI will ultimately do more harm than good — we are rushing toward a dystopia.',
                    counterPoints: [
                        'But AI already helps in medicine and climate modeling. Are you ignoring those benefits?',
                        'History shows new tech always brings fear. This time is no different.',
                        'You underestimate human adaptability. We’ve survived fire, the printing press, the internet.',
                        'AI does not have intent — it’s a tool. The danger is in how we use it.',
                        'What about autonomous weapons? That is a real threat you haven’t addressed.'
                    ]
                },
                climate: {
                    label: 'Climate action',
                    opponent: 'Individual action is meaningless — only systemic change by corporations and governments matters.',
                    counterPoints: [
                        'But consumer demand drives corporate change. Your choices matter.',
                        'Systemic change starts with public pressure — that is individual action multiplied.',
                        'Are you saying we should give up and do nothing? That is defeatist.',
                        'Many small actions add up. Plant-based diets, flying less — they do have an impact.',
                        'You ignore the power of voting and protesting. That is individual action.'
                    ]
                },
                privacy: {
                    label: 'Privacy vs security',
                    opponent: 'Security must come before privacy — if you have nothing to hide, you have nothing to fear.',
                    counterPoints: [
                        'That argument is a dangerous slippery slope. Who defines what is “suspicious”?',
                        'Privacy is a fundamental right, not a privilege. Security does not trump it.',
                        'Mass surveillance has never stopped terrorism — it just invades lives.',
                        'You are okay with a totalitarian state as long as you feel “safe”?',
                        'Data breaches prove that centralizing data creates more risk, not less.'
                    ]
                },
                education: {
                    label: 'Education reform',
                    opponent: 'Standardized testing and traditional grades are essential for measuring student progress.',
                    counterPoints: [
                        'Standardized tests measure only memorization, not critical thinking.',
                        'Finland abolished most standardized tests and they rank among the best.',
                        'Grades create anxiety and kill intrinsic motivation — we need project-based learning.',
                        'The current system was built for the industrial age. It is obsolete.',
                        'How do you account for different learning styles? One-size-fits-all fails many students.'
                    ]
                }
            };

            // ----- STATE -----
            let currentTopic = 'ai';
            let conversation = [];               // array of { role, text }
            let logicScore = 0;
            let rhetoricScore = 0;
            let roundCounter = 0;
            let opponentUsedPoints = [];        // track used counterPoints indices

            // DOM refs
            const messagesContainer = document.getElementById('messagesContainer');
            const userInput = document.getElementById('userInput');
            const submitBtn = document.getElementById('submitBtn');
            const resetBtn = document.getElementById('resetBtn');
            const logicSpan = document.getElementById('logicScore');
            const rhetoricSpan = document.getElementById('rhetoricScore');
            const topicIndicator = document.getElementById('topicIndicator');
            const topicBtns = document.querySelectorAll('.topic-btn');

            // ----- HELPERS -----
            function updateScoreDisplay() {
                logicSpan.textContent = logicScore;
                rhetoricSpan.textContent = rhetoricScore;
            }

            // Get opponent's opening statement for topic
            function getOpponentOpening(topicKey) {
                return topicData[topicKey]?.opponent || 'I strongly disagree with your position.';
            }

            // Get a fresh counterpoint (avoid repeats if possible)
            function getCounterPoint(topicKey) {
                const points = topicData[topicKey]?.counterPoints || [];
                if (!points.length) return 'I still hold my position. You haven’t convinced me.';

                // Try to pick an unused point
                const available = points.filter((_, idx) => !opponentUsedPoints.includes(idx));
                if (available.length === 0) {
                    // reset usage if all used
                    opponentUsedPoints = [];
                    return points[Math.floor(Math.random() * points.length)];
                }
                // pick random from available
                const availableIndices = points
                    .map((_, idx) => idx)
                    .filter(idx => !opponentUsedPoints.includes(idx));
                const randomIdx = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                opponentUsedPoints.push(randomIdx);
                return points[randomIdx];
            }

            // Generate AI response based on current topic and conversation
            function generateAIResponse(topicKey, userMessage) {
                // If it's the first user message, respond with opening + first counter
                if (conversation.filter(m => m.role === 'user').length === 1) {
                    const opening = getOpponentOpening(topicKey);
                    const firstPoint = getCounterPoint(topicKey);
                    return `${opening} ${firstPoint}`;
                }

                // Otherwise use a counter point, sometimes add a rebuttal
                const base = getCounterPoint(topicKey);
                const extraFiller = [
                    ' Also, consider the long-term consequences.',
                    ' That is a common misconception.',
                    ' Let’s look at the evidence.',
                    ' I think you are oversimplifying.',
                ];
                const extra = extraFiller[Math.floor(Math.random() * extraFiller.length)];
                return base + extra;
            }

            // Scoring: simple heuristic based on length, question marks, strong words
            function evaluateArgument(text) {
                let logic = 0, rhetoric = 0;
                const lower = text.toLowerCase();

                // Logic: presence of reasoning indicators
                if (lower.includes('because') || lower.includes('therefore') || lower.includes('since')) logic += 2;
                if (lower.includes('evidence') || lower.includes('data') || lower.includes('study')) logic += 2;
                if (lower.includes('if') && lower.includes('then')) logic += 1;
                if (lower.includes('for example') || lower.includes('instance')) logic += 1;
                // longer argument → more effort
                if (text.split(' ').length > 12) logic += 1;

                // Rhetoric: persuasive language, questions, strong statements
                if (text.includes('?')) rhetoric += 1;
                if (lower.includes('clearly') || lower.includes('obviously')) rhetoric += 1;
                if (lower.includes('must') || lower.includes('should') || lower.includes('need')) rhetoric += 1;
                if (lower.includes('never') || lower.includes('always')) rhetoric += 1;
                if (text.split(' ').length > 18) rhetoric += 1;

                // cap at 5 each per round
                logic = Math.min(5, logic);
                rhetoric = Math.min(5, rhetoric);
                return { logic, rhetoric };
            }

            // ----- RENDER MESSAGES -----
            function renderMessages() {
                if (!messagesContainer) return;
                // Keep only messages (clear container)
                messagesContainer.innerHTML = '';
                if (conversation.length === 0) {
                    // initial AI message
                    const opening = getOpponentOpening(currentTopic);
                    const initialMsg = document.createElement('div');
                    initialMsg.className = 'message ai';
                    initialMsg.innerHTML = `
                        <div class="avatar ai">🤖</div>
                        <div class="bubble ai-bubble"><strong>AI:</strong> ${opening} Ready to debate?</div>
                    `;
