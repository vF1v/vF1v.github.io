<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debate Me · AI vs You</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="debate-card" id="app">
        <h1>
            ⚡ Debate Me
            <span>AI</span>
        </h1>
        <div class="subhead">Pick a topic · Argue · Get scored on logic & rhetoric</div>

        <!-- Topic selector -->
        <div class="topic-selector" id="topicSelector">
            <button class="topic-btn active" data-topic="ai">🤖 AI & future</button>
            <button class="topic-btn" data-topic="climate">🌍 Climate action</button>
            <button class="topic-btn" data-topic="privacy">🔐 Privacy vs security</button>
            <button class="topic-btn" data-topic="education">📚 Education reform</button>
        </div>

        <!-- Debate window -->
        <div class="debate-window" id="debateWindow">
            <div id="messagesContainer"></div>
            <div class="score-board">
                <span>🧠 Logic: <span class="score-val" id="logicScore">0</span></span>
                <span>🎯 Rhetoric: <span class="score-val" id="rhetoricScore">0</span></span>
            </div>
        </div>

        <!-- Action area -->
        <div class="action-area">
            <div class="input-group">
                <input type="text" id="userInput" placeholder="State your argument..." />
                <button class="btn btn-primary" id="submitBtn">⚡ Debate</button>
                <button class="btn btn-reset" id="resetBtn">↺ Reset</button>
            </div>
            <div class="helper">
                <span class="hint">💡 Press <kbd>Enter</kbd> to debate</span>
                <span id="topicIndicator" style="color:#f5b342;">Topic: AI & future</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
