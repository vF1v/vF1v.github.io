<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartAI</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="sidebar">
  <h1>SmartAI</h1>

  <button id="newChat">+ New Chat</button>

  <div class="chat-list">
    <div class="chat-item">Welcome Chat</div>
  </div>

  <div class="bottom">
    <p>vF1v.github.io</p>
  </div>
</div>

<div class="main">

  <div class="topbar">
    <h2>SmartAI</h2>
  </div>

  <div id="chatBox">

    <div class="message ai">
      Hello! I'm SmartAI.
    </div>

  </div>

  <div class="typing" id="typing">
    SmartAI is typing...
  </div>

  <div class="inputArea">
    <input type="text" id="userInput" placeholder="Message SmartAI...">
    <button id="sendBtn">Send</button>
  </div>

  <div class="disclaimer">
    SmartAI is a fan-made AI interface and is not affiliated with OpenAI or ChatGPT.
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
